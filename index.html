<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pesos del Gym</title>
<meta name="description" content="Anotá el peso y los ajustes de cada máquina del gimnasio.">
<meta name="theme-color" content="#181a47">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
/* Layout: brand header, muscle-group sections of 2-up photo cards, fixed bottom tabs + FAB, bottom sheets for picking and weighing */
:root {
  --brand: #181a47;
  --on-brand: #ffffff;
  --bg: #f1f1f7;
  --surface: #ffffff;
  --surface-2: #e7e8f2;
  --line: #d6d7e6;
  --fg: #14153a;
  --muted: #5c5e80;
  --accent: #181a47;
  --on-accent: #ffffff;
  --accent-soft: rgba(24, 26, 71, .08);
  --danger: #b3261e;
  --scrim: rgba(10, 11, 30, .45);
  --illo-bg: #ffffff; /* the illustrations are ink on white in both themes */
  --font: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --item: 44px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0c1f; --surface: #15173a; --surface-2: #1f2252; --line: #2d3066;
    --fg: #eceefe; --muted: #a2a5cc; --accent: #a3a7ff; --on-accent: #0b0c1f;
    --accent-soft: rgba(163, 167, 255, .14); --danger: #ff8a80; --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0c1f; --surface: #15173a; --surface-2: #1f2252; --line: #2d3066;
  --fg: #eceefe; --muted: #a2a5cc; --accent: #a3a7ff; --on-accent: #0b0c1f;
  --accent-soft: rgba(163, 167, 255, .14); --danger: #ff8a80; --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--brand);
}
body.locked { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--brand); color: var(--on-brand);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 12px;
}
.top-in { max-width: 720px; margin: 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; font-weight: 800; font-size: 28px; letter-spacing: -.01em; }
.top .sub { font-size: 13px; opacity: .75; }
.note {
  max-width: 720px; margin: 12px auto 0; padding: 10px 12px; border-radius: 10px;
  background: var(--accent-soft); color: var(--fg); font-size: 14px;
}

main {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px));
}

/* Groups + cards */
.group { margin-top: 18px; }
.group-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; }
.group-h h2 { margin: 0; font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
.group-h span { color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card {
  display: flex; flex-direction: column; text-align: left; padding: 0; border: 1px solid var(--line);
  background: var(--surface); border-radius: 14px; overflow: hidden; min-width: 0;
  transition: transform .12s ease;
}
.card:active { transform: scale(.97); }
.ph {
  aspect-ratio: 4 / 3; max-width: 100%; background: var(--surface-2); display: grid; place-items: center;
  color: var(--muted); font-size: 28px; font-weight: 700; position: relative; overflow: hidden;
}
/* Absolute so images without an intrinsic size (the SVGs) can't stretch the box */
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.ph.illo { background: var(--illo-bg); }
.ph.illo img { object-fit: contain; padding: 8%; }
.hero.ph.illo { aspect-ratio: 3 / 1; }
.hero.ph.illo img { padding: 4% 6%; }
.info { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.name { font-weight: 600; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.w { font-size: 30px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--accent); letter-spacing: -.02em; }
.w small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.adj { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }

.empty { text-align: center; padding: 56px 12px; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.empty .btn { margin-top: 18px; display: inline-block; flex: none; padding-inline: 22px; }

/* Bottom nav + FAB */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: var(--nav-h); }
.tab {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .03em; position: relative;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] .pill { background: var(--accent-soft); }
.pill { padding: 3px 14px; border-radius: 999px; display: grid; }
.fab {
  position: fixed; z-index: 7; width: 60px; height: 60px; border-radius: 18px; border: 0;
  right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px));
  bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
  background: var(--accent); color: var(--on-accent); display: grid; place-items: center;
  box-shadow: 0 6px 18px rgba(10, 11, 40, .3);
}
.fab svg { width: 30px; height: 30px; }

/* Sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 92%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 20px 20px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(16px + env(safe-area-inset-bottom, 0px));
  animation: up .22s ease-out;
}
.sheet.tall { height: 92%; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.sheet-in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 0; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-h h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.01em; overflow-wrap: anywhere; }
.icon-btn { border: 0; background: var(--surface-2); width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.lbl { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; display: block; }
.hero { border-radius: 14px; overflow: hidden; max-height: 180px; }
.hero.ph { aspect-ratio: 16 / 9; }

.wheel-row { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 10px; }
.step { height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font-size: 17px; font-weight: 700; }
.wheel-box { position: relative; height: calc(var(--item) * 5); }
.wheel-box::before {
  content: ""; position: absolute; left: 0; right: 0; top: calc(var(--item) * 2); height: var(--item);
  background: var(--accent-soft); border-radius: 12px; pointer-events: none;
}
.wheel-box::after {
  content: "kg"; position: absolute; right: 14px; top: calc(var(--item) * 2); line-height: var(--item);
  color: var(--muted); font-weight: 600; pointer-events: none;
}
.wheel {
  height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; padding-block: calc(var(--item) * 2);
  scrollbar-width: none; overscroll-behavior: contain; position: relative;
  -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
  mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
}
.wheel::-webkit-scrollbar { display: none; }
.wi {
  height: var(--item); line-height: var(--item); text-align: center; scroll-snap-align: center;
  font-size: 21px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums;
  transition: font-size .08s, color .08s;
}
.wi.on { font-size: 30px; font-weight: 800; color: var(--fg); }
.prev { font-size: 13px; color: var(--muted); text-align: center; margin-top: 6px; }

.more { border: 1px dashed var(--line); background: none; border-radius: 12px; padding: 12px; color: var(--muted); font-weight: 600; }
.details { display: flex; flex-direction: column; gap: 16px; }
.photo-pick { display: flex; gap: 12px; align-items: center; }
.photo-pick .ph { width: 112px; flex: none; border-radius: 12px; overflow: hidden; font-size: 22px; }
.photo-acts { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.btn-file { display: inline-block; padding: 9px 14px; border-radius: 10px; background: var(--surface-2); font-weight: 600; cursor: pointer; }
.field { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: none; font-size: 14px; font-weight: 500; white-space: nowrap; flex: none; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.err { color: var(--danger); font-size: 14px; margin: 0; }
.acts { display: flex; gap: 10px; }
.btn { flex: 1; padding: 14px; border-radius: 14px; border: 0; font-weight: 700; font-size: 16px; }
.btn-main { background: var(--accent); color: var(--on-accent); }
.btn-main:disabled { opacity: .6; }
.btn-ghost { background: var(--surface-2); }
.btn-danger { background: none; color: var(--danger); border: 1px solid var(--line); flex: 0 0 auto; padding-inline: 16px; }
.btn-del { background: var(--danger); color: var(--surface); }
.confirm { background: var(--surface-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.confirm p { margin: 0; }

/* Picker */
.pick-head { position: sticky; top: -8px; z-index: 1; background: var(--surface); display: flex; flex-direction: column; gap: 12px; padding-block: 8px 4px; margin-top: -8px; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.search .field { padding-left: 42px; }
.plist { display: flex; flex-direction: column; }
.plist h3 { margin: 14px 0 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.row {
  display: grid; grid-template-columns: 76px minmax(0, 1fr) 28px; gap: 12px; align-items: center; text-align: left;
  border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 0;
}
.row .ph { border-radius: 10px; overflow: hidden; font-size: 18px; }
.row b { display: block; font-weight: 600; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
.row small { color: var(--muted); font-size: 13px; }
.row .mark { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line); color: var(--muted); }
.row .mark svg { width: 16px; height: 16px; }
.row.added .mark { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.row.added small { color: var(--accent); font-weight: 600; }
.custom { margin-top: 18px; }
#picker { z-index: 23; }
#picker.selecting .plist { padding-bottom: 84px; }
.pick-foot {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 24; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
}
.pick-foot .btn { width: 100%; max-width: 560px; margin: 0 auto; display: block; }

/* Routines */
.section-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 22px 0 12px; }
.section-h h2 { margin: 0; font-size: 20px; font-weight: 700; }
.rlist { display: flex; flex-direction: column; gap: 12px; }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.rcard h3 { margin: 0 0 2px; font-size: 21px; font-weight: 800; letter-spacing: -.01em; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 13px; margin: 0; }
.strip { display: flex; gap: 6px; overflow: hidden; }
.strip .ph, .strip .more-n { width: 58px; flex: none; border-radius: 8px; font-size: 14px; }
.strip .more-n { aspect-ratio: 4 / 3; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); font-weight: 700; }
.rrow { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.rrow .ph { border-radius: 8px; font-size: 14px; }
.rrow b { display: block; font-weight: 600; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.rrow small { color: var(--muted); font-size: 13px; }
.ord { display: flex; gap: 4px; }
.ord button { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--surface-2); display: grid; place-items: center; color: var(--fg); }
.ord button:disabled { opacity: .35; }
.ord svg { width: 18px; height: 18px; }

/* Done today button */
.btn-sm { flex: 0 0 auto; padding-inline: 14px; }
.btn svg { width: 20px; height: 20px; vertical-align: -4px; margin-right: 6px; }
.btn-done { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }

/* Calendar */
.cal-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-top: 14px; }
.cal-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-h b { font-size: 18px; font-weight: 700; }
.cal-h b::first-letter { text-transform: uppercase; }
.cal-h button:disabled { opacity: .35; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wd { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); padding-block: 4px; }
.day {
  aspect-ratio: 1; border: 0; border-radius: 10px; background: none; display: grid; place-items: center; min-width: 0;
  font-size: 15px; font-variant-numeric: tabular-nums; color: var(--fg); padding: 0;
}
.day.out { visibility: hidden; }
.day.lv3 { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.day.today { box-shadow: inset 0 0 0 2px var(--accent); }
.day.sel { outline: 2px solid var(--fg); outline-offset: 1px; }
.day-h { margin: 22px 0 10px; font-size: 18px; font-weight: 700; }
.day-h::first-letter { text-transform: uppercase; }
.dlist { display: flex; flex-direction: column; gap: 10px; }
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.scard-h { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.scard-h b { font-size: 16px; overflow-wrap: anywhere; }
.scard-h span { color: var(--muted); font-size: 13px; white-space: nowrap; }
.scard ul { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.scard li { display: flex; justify-content: space-between; gap: 10px; }
.scard li span:first-child { overflow-wrap: anywhere; min-width: 0; }
.scard li span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scard .link { margin-top: 10px; font-size: 13px; color: var(--muted); }

/* Progress */
.prog { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0; }
.stat span { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.stat b { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.chart-box { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 4px 4px; }
.chart-box svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.chart-box .grid-l { stroke: var(--line); stroke-width: 1; }
.chart-box .ax { fill: var(--muted); font-size: 11px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart-box .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart-box .ar { fill: var(--accent-soft); stroke: none; }
.chart-box .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart-box .end { fill: var(--fg); font-family: var(--font); font-weight: 800; font-size: 14px; }
.chart-box .xh { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.tip {
  position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); padding: 6px 9px; border-radius: 8px;
  font-size: 13px; white-space: nowrap; transform: translate(-50%, -110%);
}
.tip b { font-size: 15px; }
.hist { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.hist h3 { margin: 0; padding: 12px 14px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.hist table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.hist td { padding: 10px 14px; border-top: 1px solid var(--line); }
.hist td:last-child { text-align: right; font-weight: 600; }
.up { color: var(--muted); font-weight: 400; font-size: 13px; margin-right: 6px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
}
/* Backup */
.backup { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.backup h2 { margin: 0; font-weight: 700; font-size: 18px; }
.backup p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
label.btn { text-align: center; cursor: pointer; }

@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .card, .wi { transition: none; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <h1 id="title">Pesos</h1>
    <span class="sub" id="sub"></span>
  </div>
</header>

<main>
  <p class="note" id="note" hidden></p>
  <section id="view-pesos"></section>
  <section id="view-train" hidden></section>
  <section id="view-cal" hidden></section>
  <section id="view-prog" hidden></section>
</main>

<button class="fab" id="fab" aria-label="Agregar ejercicio" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="nav" aria-label="Secciones">
  <div class="nav-in">
    <button class="tab" id="tab-pesos" aria-current="page">

<script>
const GROUPS = ["Pecho", "Espalda", "Hombros", "Bíceps", "Tríceps", "Piernas", "Glúteos", "Abdomen", "Otros"];
// [id, grupo, nombre, alias para el buscador] — ilustración en img/<id>.svg y las dos posiciones en img/<id>-2.svg
const CATALOG = [

  ["dominadas","Espalda","Dominadas","pull ups, barra fija"],
  ["peso-muerto","Espalda","Peso muerto","deadlift"],
  ["hiperextensiones","Espalda","Hiperextensiones","lumbares, banco romano"],
  ["press-hombros-mancuernas","Hombros","Press de hombros con mancuernas","press militar"],
  ["press-militar-barra","Hombros","Press militar con barra","press sentado"],

  ["elevaciones-frontales","Hombros","Elevaciones frontales","vuelos frontales"],
  ["vuelos-posteriores","Hombros","Vuelos posteriores","deltoides posterior, pajaros"],
  ["encogimientos","Hombros","Encogimientos","trapecios, shrugs"],
  ["curl-barra","Bíceps","Curl con barra","biceps"],
  ["curl-barra-z","Bíceps","Curl con barra Z","biceps"],
  ["curl-mancuernas","Bíceps","Curl con mancuernas","biceps"],
  ["curl-martillo","Bíceps","Curl martillo","hammer"],
  ["curl-predicador-maquina","Bíceps","Curl predicador en máquina","scott, banco scott"],
  ["curl-predicador-mancuernas","Bíceps","Curl predicador con mancuernas","scott, banco scott"],
  ["curl-maquina","Bíceps","Curl en máquina","biceps"],
  ["curl-inclinado","Bíceps","Curl inclinado con mancuernas","biceps"],
  ["curl-polea","Bíceps","Curl en polea","biceps, cable"],
  ["triceps-polea","Tríceps","Tríceps en polea","pushdown, barra"],
  ["triceps-soga","Tríceps","Tríceps con soga","pushdown, cuerda"],
  ["triceps-tras-nuca","Tríceps","Extensión de tríceps tras nuca","sobre la cabeza"],
  ["triceps-tras-nuca-polea","Tríceps","Extensión de tríceps tras nuca en polea","soga, sobre la cabeza, cable"],
  ["press-frances","Tríceps","Press francés","rompecraneos, skull crusher"],
  ["fondos-triceps","Tríceps","Fondos de tríceps","dips"],
  ["triceps-maquina","Tríceps","Extensión de tríceps en máquina","triceps"],
  ["patada-triceps","Tríceps","Patada de tríceps","kickback"],
  ["prensa","Piernas","Prensa","leg press, prensa 45"],
  ["sentadilla-barra","Piernas","Sentadilla con barra","squat"],
  ["sentadilla-smith","Piernas","Sentadilla en Smith","multipower, squat"],
  ["hack-squat","Piernas","Hack squat","sentadilla hack, jaca"],
  ["sillon-cuadriceps","Piernas","Sillón de cuádriceps","extensiones, camilla de cuadriceps"],
  ["camilla-femorales","Piernas","Camilla de femorales","isquios, curl femoral acostado"],
  ["femorales-sentado","Piernas","Femorales sentado","isquios, curl femoral"],
  ["peso-muerto-rumano","Piernas","Peso muerto rumano","isquios, rdl"],
  ["estocadas","Piernas","Estocadas","zancadas, lunges"],
  ["gemelos-de-pie","Piernas","Gemelos de pie","pantorrillas, pantorrilla"],
  ["gemelos-sentado","Piernas","Gemelos sentado","pantorrillas, soleo"],
  ["aductores-maquina","Piernas","Aductores en máquina","aductor, cerrar piernas"],
  ["puente-gluteos","Glúteos","Puente de glúteos","hip thrust, empuje de cadera"],
  ["abductores-maquina","Glúteos","Abductores en máquina","abductor, abrir piernas"],
  ["patada-gluteo-polea","Glúteos","Patada de glúteo en polea","kickback, polea"],
  ["sentadilla-una-pierna","Glúteos","Sentadilla a una pierna","bulgara, split squat"],
  ["crunch-polea","Abdomen","Crunch en polea","abdominales, soga"],
  ["abdominales","Abdomen","Abdominales (crunch)","crunch, encogimientos"],
  ["crunch-declinado","Abdomen","Crunch declinado","abdominales, banco declinado"],
  ["elevacion-piernas","Abdomen","Elevación de piernas","abdominales, inferiores"],
  ["plancha-lateral","Abdomen","Plancha lateral","plank, oblicuos"],
  ["rueda-abdominal","Abdomen","Rueda abdominal","ab rollout, rollo"]
].map(([id, group, name, aliases]) => ({ id, group, name, aliases, img: "img/" + id + ".svg", img2: "img/" + id + "-2.svg", illo: true }));
const CAT = Object.fromEntries(CATALOG.map(c => [c.id, c]));
const STEP = 2.5, MAX = 300, ITEM = 44;
const $ = s => document.querySelector(s);

let exercises = [], routines = [], sessions = [], loaded = false, hasDb = true;
const st = {
  view: "pesos", editing: null, cat: null, weight: 0, group: GROUPS[0], photoFile: null, photoUrl: null, removePhoto: false,
  chartId: null, pickGroup: "Todos", pick: { mode: "add", sel: [], onDone: null }, rdraft: null,
  calMonth: null, calSel: null
};

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k);
  return el;
}
const fmt = w => (Math.round(w * 10) / 10).toLocaleString("es-AR", { maximumFractionDigits: 1 });
const today = () => new Date().toLocaleDateString("en-CA");
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString("es-AR", { day: "numeric", month: "short" });
const initials = n => n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const dayKey = ts => new Date(ts).toLocaleDateString("en-CA");
const dur = ms => { const m = Math.max(1, Math.round(ms / 60000)); return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0"); };
const plural = (n, one, many) => n + " " + (n === 1 ? one : many);

// A saved exercise merged with its catalog entry (custom ones keep their own name, group and photo)
function view(doc) {
  const c = doc.cat ? CAT[doc.cat] : null;
  const own = doc.photoData || null;
  return { ...doc, name: c ? c.name : doc.name, group: c ? c.group : (doc.group || "Otros"), img: own || (c ? c.img : null), illo: !own && !!c };
}

// Routines and workouts point at an exercise key: a catalog id (maybe not added yet) or a custom exercise id
function itemInfo(key) {
  const ex = exercises.find(e => e.id === key);
  if (ex) return { key, name: ex.name, group: ex.group, img: ex.img, illo: ex.illo, ex };
  const c = CAT[key];
  return c ? { key, name: c.name, group: c.group, img: c.img, illo: true, ex: null } : null;
}

function photoEl(src, name, cls, illo) {
  const box = h("div", { class: "ph" + (cls ? " " + cls : "") + (illo ? " illo" : "") });
  if (src) {
    const img = h("img", { src, alt: "", loading: "lazy" });
    img.onerror = () => box.replaceChildren(initials(name || "?"));
    box.append(img);
  } else box.append(initials(name || "?"));
  return box;
}

function setNote(t) { $("#note").textContent = t || ""; $("#note").hidden = !t; }
let toastT;
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 1800); }

/* ---------- Pesos view ---------- */
function renderPesos() {
  const root = $("#view-pesos");
  root.replaceChildren();
  if (!loaded) { root.append(h("div", { class: "empty" }, "Cargando tus ejercicios…")); return; }
  if (!exercises.length) {
    root.append(h("div", { class: "empty" },
      h("b", {}, "Armá tu lista"),
      hasDb ? "Elegí los ejercicios que hacés y anotá el peso de cada uno." : "",
      hasDb ? h("br") : null,
      hasDb ? h("button", { class: "btn btn-main", onclick: () => openPicker("add") }, "Elegir ejercicios") : null));
    if (hasDb) root.append(backupEl());
    return;
  }
  for (const g of GROUPS) {
    const list = exercises.filter(e => e.group === g).sort((a, b) => a.name.localeCompare(b.name, "es"));
    if (!list.length) continue;
    root.append(h("section", { class: "group" },
      h("div", { class: "group-h" }, h("h2", {}, g), h("span", {}, list.length + (list.length === 1 ? " ejercicio" : " ejercicios"))),
      h("div", { class: "grid" }, list.map(ex =>
        h("button", { class: "card", onclick: () => openSheet(ex) },
          photoEl(ex.img, ex.name, "", ex.illo),
          h("span", { class: "info" },
            h("span", { class: "name" }, ex.name),
            h("span", { class: "w" }, fmt(ex.weight || 0), h("small", {}, "kg")),
            ex.adjust ? h("span", { class: "adj" }, ex.adjust) : null))))));
  }
  root.append(backupEl());
}

function backupEl() {
  return h("section", { class: "backup" },
    h("h2", {}, "Copia de seguridad"),
    h("p", {}, "Tus pesos, rutinas y entrenamientos se guardan solo en este celular. Bajá una copia de vez en cuando para no perderlos si cambiás de teléfono o borrás los datos del navegador."),
    h("div", { class: "acts" },
      h("button", { class: "btn btn-ghost", onclick: exportData }, "Exportar copia"),
      h("label", { class: "btn btn-ghost", for: "import-in" }, "Importar copia")));
}

/* ---------- Entrenar view: routines, or the running workout ---------- */
const UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>';
const DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const XMARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>';
const PREV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
const NEXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const icon = (svg, attrs) => { const b = h("button", attrs); b.innerHTML = svg; return b; };

// A routine marked as done: { date, start (when it was marked), routine, name, done: { key: { w, n } } }
const doneToday = r => sessions.find(s => s.routine === r.id && s.date === today());

function renderTrain() {
  const root = $("#view-train");
  root.replaceChildren();
  if (!loaded) return;
  if (!routines.length) {
    root.append(h("div", { class: "empty" },
      h("b", {}, "Armá tu primera rutina"),
      "Juntá los ejercicios de cada día, por ejemplo «Día A · Pecho y tríceps». Cuando la hagas, la marcás y queda en el calendario.",
      h("br"),
      h("button", { class: "btn btn-main", onclick: () => openRoutine(null) }, "Crear rutina")));
    return;
  }
  root.append(h("div", { class: "section-h" }, h("h2", {}, "Tus rutinas")));
  root.append(h("div", { class: "rlist" }, routines.map(r => {
    const its = r.items.map(itemInfo).filter(Boolean);
    const groups = [...new Set(its.map(i => i.group))].join(", ");
    const hecha = doneToday(r);
    const last = sessions.filter(s => s.routine === r.id).sort((a, b) => b.start - a.start)[0];
    const when = hecha ? " · hecha hoy" : last ? " · última vez " + fmtDate(last.date) : "";
    const mark = h("button", { class: "btn " + (hecha ? "btn-done" : "btn-main"), "aria-pressed": String(!!hecha), onclick: () => toggleToday(r) });
    mark.innerHTML = hecha ? CHECK : "";
    mark.append(hecha ? "Hecha hoy" : "La hice hoy");
    return h("article", { class: "rcard" },
      h("div", {},
        h("h3", {}, r.name),
        h("p", { class: "meta" }, plural(its.length, "ejercicio", "ejercicios") + (groups ? " · " + groups : "") + when)),
      h("div", { class: "strip" },
        its.slice(0, 5).map(i => photoEl(i.img, i.name, "", i.illo)),
        its.length > 5 ? h("div", { class: "more-n" }, "+" + (its.length - 5)) : null),
      h("div", { class: "acts" },
        h("button", { class: "btn btn-ghost btn-sm", onclick: () => openRoutine(r) }, "Editar"),
        h("button", { class: "btn btn-ghost btn-sm", onclick: () => openRoutine({ id: null, name: r.name + " (copia)", items: r.items }) }, "Duplicar"),
        mark));
  })));
}

// Marks the routine as done today with the weights you have now; tapping again undoes it
function toggleToday(r) {
  const prev = doneToday(r);
  if (prev) {
    mutate(db => { delete db.sessions[prev.id]; });
    toast("Desmarcada");
    return;
  }
  const done = {};
  for (const k of r.items) {
    const it = itemInfo(k);
    if (it) done[k] = { w: it.ex ? (it.ex.weight || 0) : null, n: it.name };
  }
  mutate(db => { db.sessions["s" + uid()] = { date: today(), start: Date.now(), routine: r.id, name: r.name, done }; });
  toast("Anotada en el calendario");
}

/* ---------- Calendario view ---------- */
const mondayOf = date => { const d = new Date(date + "T12:00:00"); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dayKey(d); };
function weekStreak(done) {
  const weeks = new Set(done.map(s => mondayOf(s.date)));
  const d = new Date(mondayOf(today()) + "T12:00:00");

  while (weeks.has(dayKey(d))) { n++; d.setDate(d.getDate() - 7); }
  return n;
}

function yTicks(min, max) {
  if (min === max) { min -= 5; max += 5; }
  const span = max - min;
  const step = [1, 2.5, 5, 10, 20, 25, 50, 100].find(s => span / s <= 4) || 100;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = [];
  for (let v = lo; v <= hi + 1e-9; v += step) out.push(v);
  return out;
}

function drawChart(box, pts) {
  const NS = "http://www.w3.org/2000/svg";
  const s = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const W = Math.max(280, box.clientWidth - 8), H = 240, m = { l: 40, r: 30, t: 22, b: 28 };
  const ticks = yTicks(Math.min(...pts.map(p => p.w)), Math.max(...pts.map(p => p.w)));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const x = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r);
  const y = v => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Peso a lo largo del tiempo" });
  for (const v of ticks) {
    svg.append(s("line", { class: "grid-l", x1: m.l, x2: W - m.r, y1: y(v), y2: y(v) }));
    const tx = s("text", { class: "ax", x: m.l - 6, y: y(v) + 4, "text-anchor": "end" }); tx.textContent = fmt(v); svg.append(tx);
  }
  const xl = [pts[0], pts[pts.length - 1]];
  if (pts.length > 4) xl.splice(1, 0, pts[Math.floor(pts.length / 2)]);
  xl.forEach((p, i) => {
    const tx = s("text", { class: "ax", x: x(p.t), y: H - 8, "text-anchor": i === 0 ? "start" : i === xl.length - 1 ? "end" : "middle" });
    tx.textContent = fmtDate(p.d); svg.append(tx);
  });
  const line = pts.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + " " + y(p.w).toFixed(1)).join(" ");
  svg.append(s("path", { class: "ar", d: `${line} L${x(t1)} ${y(y0)} L${x(t0)} ${y(y0)} Z` }));
  svg.append(s("path", { class: "ln", d: line }));
  pts.forEach((p, i) => svg.append(s("circle", { class: "dot", cx: x(p.t), cy: y(p.w), r: i === pts.length - 1 ? 5.5 : 4 })));
  const lp = pts[pts.length - 1];
  const lt = s("text", { class: "end", x: x(lp.t), y: y(lp.w) - 10, "text-anchor": "end" }); lt.textContent = fmt(lp.w); svg.append(lt);

  const xh = s("line", { class: "xh", y1: m.t, y2: H - m.b, visibility: "hidden" }); svg.append(xh);
  const hit = s("rect", { x: 0, y: 0, width: W, height: H, fill: "transparent" }); svg.append(hit);
  const tip = h("div", { class: "tip", hidden: "" });
  const show = ev => {
    const r = svg.getBoundingClientRect(), k = W / r.width;
    const px = (ev.clientX - r.left) * k;
    const p = pts.reduce((a, b) => Math.abs(x(b.t) - px) < Math.abs(x(a.t) - px) ? b : a);
    xh.setAttribute("x1", x(p.t)); xh.setAttribute("x2", x(p.t)); xh.setAttribute("visibility", "visible");
    tip.replaceChildren(h("b", {}, fmt(p.w) + " kg"), " · " + fmtDate(p.d));
    tip.style.left = Math.min(Math.max(x(p.t) / k + 4, 60), r.width - 56) + "px";
    tip.style.top = (y(p.w) / k + 8) + "px";
    tip.hidden = false;
  };
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); });
  box.append(svg, tip);
}

  items.push(it);
}
wheel.append(...items);
let activeIdx = -1, raf = 0;
function markActive(i) {
  i = Math.max(0, Math.min(items.length - 1, i));
  if (i === activeIdx) return;
  items[activeIdx]?.classList.remove("on");
  items[activeIdx]?.removeAttribute("aria-selected");
  items[i].classList.add("on");
  items[i].setAttribute("aria-selected", "true");
  activeIdx = i;
  st.weight = i * STEP;
}
function setWheel(w, smooth) {
  const i = Math.round(Math.max(0, Math.min(MAX, w)) / STEP);
  wheel.scrollTo({ top: i * ITEM, behavior: smooth ? "smooth" : "auto" });
  markActive(i);
}
wheel.addEventListener("scroll", () => {
  if (!raf) raf = requestAnimationFrame(() => { raf = 0; markActive(Math.round(wheel.scrollTop / ITEM)); });
});
wheel.addEventListener("keydown", e => {
  if (e.key === "ArrowUp") { e.preventDefault(); setWheel(st.weight - STEP, true); }
  if (e.key === "ArrowDown") { e.preventDefault(); setWheel(st.weight + STEP, true); }

  const src = own || (st.cat ? st.cat.img : null);
  $("#photo-prev").replaceWith(Object.assign(photoEl(src, st.cat ? st.cat.name : $("#name-in").value, "", !own && !!st.cat), { id: "photo-prev" }));
  $("#photo-rm").hidden = !own;
  $("#photo-rm").textContent = st.cat ? "Volver a la ilustración" : "Quitar foto";
}

// ex: a saved exercise (or null); cat: the catalog entry when adding from the list
function openSheet(ex, cat) {
  st.editing = ex || null;
  st.cat = ex ? (ex.cat ? CAT[ex.cat] : null) : (cat || null);
  const custom = !st.cat;
  st.photoFile = null; st.removePhoto = false;
  if (st.photoUrl) URL.revokeObjectURL(st.photoUrl);
  st.photoUrl = null;
  $("#sheet-title").textContent = ex ? ex.name : (cat ? cat.name : "Ejercicio propio");
  const hero = $("#hero");
  hero.hidden = custom;
  if (!custom) {
    const illo = !ex || ex.illo;
    hero.replaceChildren(photoEl(illo ? st.cat.img2 : ex.img, st.cat.name, "hero", illo));
  }
  $("#name-in").value = ex && custom ? ex.name : "";
  $("#adj-in").value = ex ? (ex.adjust || "") : "";
  pickGroup(ex ? ex.group : (store.get("lastGroup") || GROUPS[0]));
  $("#details").hidden = !custom || !!ex;
  $("#meta").hidden = !custom;
  $("#more").hidden = !ex;
  $("#more").textContent = custom ? "Editar foto, nombre y grupo" : "Usar una foto mía";
  $("#del").hidden = !ex;
  $("#confirm").hidden = true; $("#acts").hidden = false;
  $("#err").hidden = true;
  const hist = ex?.history || [];
  const prevPt = hist.length > 1 ? hist[hist.length - 2] : null;
  $("#prev").hidden = !prevPt;
  if (prevPt) $("#prev").textContent = "Antes: " + fmt(prevPt.w) + " kg (" + fmtDate(prevPt.d) + ")";
  $("#save").disabled = false; $("#save").textContent = saveLabel();
  setPhotoPreview();
  $("#sheet").scrollTop = 0;
  $("#scrim").hidden = false; $("#sheet").hidden = false;
  document.body.classList.add("locked");
  activeIdx = -1;
  requestAnimationFrame(() => setWheel(ex ? (ex.weight || 0) : 20, false));
}
function saveLabel() { return st.editing ? "Guardar" : "Agregar a mis ejercicios"; }
function closeSheet() {
  $("#sheet").hidden = true;
  if (st.photoUrl) URL.revokeObjectURL(st.photoUrl);
  st.photoUrl = null; st.photoFile = null; st.editing = null; st.cat = null;
  afterClose();
}
function closeTop() {
  if (!$("#picker").hidden) closePicker();
  else if (!$("#sheet").hidden) closeSheet();
  else if (!$("#rsheet").hidden) closeRoutine();
}
$("#close").onclick = closeSheet;
$("#scrim").onclick = closeTop;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeTop(); });
$("#more").onclick = () => { $("#details").hidden = false; $("#more").hidden = true; };
$("#name-in").addEventListener("input", () => { if (!st.cat) setPhotoPreview(); });
$("#photo-in").onchange = e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  if (st.photoUrl) URL.revokeObjectURL(st.photoUrl);
  st.photoFile = f; st.photoUrl = URL.createObjectURL(f); st.removePhoto = false;
  setPhotoPreview();
};
$("#photo-rm").onclick = () => {
  if (st.photoUrl) URL.revokeObjectURL(st.photoUrl);
  st.photoFile = null; st.photoUrl = null; st.removePhoto = true;
  setPhotoPreview();
};

async function shrink(file, max) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c;
  } finally { URL.revokeObjectURL(url); }
}

function showErr(t) { $("#err").textContent = t; $("#err").hidden = false; }
function errText(e) {
  if (e?.name === "QuotaExceededError") return "No hay más espacio para guardar. Quitá fotos de ejercicios propios que no uses.";
  return "No se pudo guardar. Probá de nuevo.";
}

$("#save").onclick = async () => {
  const custom = !st.cat;
  const name = $("#name-in").value.trim();
  if (custom && !name) { $("#details").hidden = false; $("#more").hidden = true; showErr("Poné el nombre del ejercicio."); $("#name-in").focus(); return; }
  if (!hasDb) { showErr("Este navegador no deja guardar datos. Abrí la app en una pestaña normal, no en modo incógnito."); return; }
  const ex = st.editing;
  const btn = $("#save");
  btn.disabled = true; btn.textContent = "Guardando…"; $("#err").hidden = true;
  try {
    const base = ex ? structuredClone(ex.raw) : { created: Date.now(), history: [] };
    const w = st.weight;
    const hist = base.history || [];
    if (!ex || w !== ex.weight) {
      const d = today();
      if (hist.length && hist[hist.length - 1].d === d) hist[hist.length - 1].w = w;
      else hist.push({ d, w });
    }
    const data = { ...base, adjust: $("#adj-in").value.trim(), weight: w, history: hist.slice(-400), updated: Date.now() };
    if (custom) { data.name = name; data.group = st.group; data.cat = null; }
    else { data.cat = st.cat.id; delete data.name; delete data.group; }
    if (st.photoFile) {
      const c = await shrink(st.photoFile, 480);
      data.photoData = c.toDataURL("image/jpeg", .75);
    } else if (st.removePhoto) {
      data.photoData = null;
    }
    // Catalog exercises use their catalog id as the key, so each one is added once
    const id = ex ? ex.id : !custom ? st.cat.id : "c" + uid();
    putDoc(id, data);
    if (custom) store.set("lastGroup", st.group);
    closeSheet();
    toast(ex ? "Guardado" : "Agregado a tus ejercicios");
  } catch (e) {
    btn.disabled = false; btn.textContent = saveLabel();
    showErr(errText(e));
  }
};

$("#del").onclick = () => {
  $("#confirm-txt").textContent = "¿Quitar «" + st.editing.name + "» de tus ejercicios? También se borra su historial de pesos.";
  $("#confirm").hidden = false; $("#acts").hidden = true;
};
$("#confirm-no").onclick = () => { $("#confirm").hidden = true; $("#acts").hidden = false; };
$("#confirm-yes").onclick = async () => {
  const ex = st.editing;
  try {
    delDoc(ex.id);
    closeSheet();
    toast("Quitado de tus ejercicios");
  } catch (e) {
    $("#confirm").hidden = true; $("#acts").hidden = false;
    showErr("No se pudo quitar. Probá de nuevo.");
  }
};
$("#fab").onclick = () => { if (st.view === "pesos") openPicker("add"); else openRoutine(null); };

/* ---------- Data (se guarda en este navegador) ---------- */
// One JSON document: { app, version, exercises: {id: …}, routines: {id: …}, sessions: {id: …} }
const KEY = "pesos-gym:v1";
const emptyDb = () => ({ exercises: {}, routines: {}, sessions: {} });
function readDb() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || "{}");
    return { exercises: d.exercises || {}, routines: d.routines || {}, sessions: d.sessions || {} };
  } catch { return null; }
}
function writeDb(db) {
  localStorage.setItem(KEY, JSON.stringify({ app: "pesos-gym", version: 2, ...db }));
}
function refresh() {
  const db = readDb();
  if (db === null) {
    hasDb = false;
    setNote("Este navegador no deja guardar datos. Abrí la app en una pestaña normal, no en modo incógnito.");
  }
  const d = db || emptyDb();
  exercises = Object.entries(d.exercises).map(([id, x]) => view({ ...x, id, raw: x }));
  routines = Object.entries(d.routines).map(([id, r]) => ({ ...r, id })).sort((a, b) => a.created - b.created);
  sessions = Object.entries(d.sessions).map(([id, s]) => ({ ...s, id }));
  loaded = true;
  render();
}
function mutate(fn) { const db = readDb() || emptyDb(); fn(db); writeDb(db); refresh(); }
function putDoc(id, data) { mutate(db => { db.exercises[id] = data; }); }
function delDoc(id) {
  mutate(db => {
    delete db.exercises[id];
    // A deleted custom exercise leaves its routines; catalog ones stay, they can be added again
    if (!CAT[id]) for (const r of Object.values(db.routines)) r.items = r.items.filter(k => k !== id);
  });
}

function exportData() {
  const blob = new Blob([JSON.stringify({ app: "pesos-gym", version: 2, ...(readDb() || emptyDb()) })], { type: "application/json" });
  const a = h("a", { href: URL.createObjectURL(blob), download: "pesos-gym-" + today() + ".json" });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Copia descargada");
}
$("#import-in").onchange = async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  let d;
  try { d = JSON.parse(await f.text()); } catch { d = null; }
  if (!d || d.app !== "pesos-gym" || typeof d.exercises !== "object") { toast("Ese archivo no es una copia de Pesos del Gym"); return; }
  const next = { exercises: d.exercises, routines: d.routines || {}, sessions: d.sessions || {} };
  const what = [plural(Object.keys(next.exercises).length, "ejercicio", "ejercicios"), plural(Object.keys(next.routines).length, "rutina", "rutinas"), plural(Object.keys(next.sessions).length, "entrenamiento", "entrenamientos")].join(", ");
  if (!confirm("¿Reemplazar tus datos con esta copia (" + what + ")? Lo que tenés ahora se pierde.")) return;
  try { writeDb(next); refresh(); toast("Copia restaurada"); } catch (err) { toast(errText(err)); }
};

window.addEventListener("storage", e => { if (e.key === KEY) refresh(); });
navigator.storage?.persist?.().catch(() => {});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

st.view = VIEWS.includes(store.get("view")) ? store.get("view") : "pesos";
refresh();
</script>
